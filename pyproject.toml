[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-bootstrap"
version = "1.0.0"
description = "Professional CLI toolkit for Odoo Partner development teams"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "BizApps Team", email = "dev@bizapps.vn"}
]
keywords = ["odoo", "erp", "devops", "cli", "docker"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "docker>=7.0.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "packaging>=24.0",
    "toml>=0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "black>=24.3.0",
    "ruff>=0.3.0",
    "isort>=5.13.0",
    "mypy>=1.9.0",
]

[project.scripts]
odoo-bootstrap = "odoo_bootstrap.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["odoo_bootstrap*"]

[tool.setuptools.package-data]
odoo_bootstrap = ["templates/**/*", "config/**/*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=odoo_bootstrap --cov-report=term-missing"
