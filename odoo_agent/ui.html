<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odoo Demo Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .card { background: white; border-radius: 12px; padding: 32px; width: 100%; max-width: 480px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; color: #1a1a1a; }
  .sub { color: #666; font-size: 14px; margin-bottom: 28px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; margin-top: 16px; }
  input, select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s; }
  input:focus, select:focus { border-color: #4F46E5; }
  .toggle { position: relative; }
  .toggle input { padding-right: 44px; }
  .eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888; font-size: 18px; user-select: none; }
  .scenarios { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .scenario-btn { padding: 8px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 13px; cursor: pointer; background: white; text-align: center; transition: all 0.2s; }
  .scenario-btn.active { border-color: #4F46E5; background: #EEF2FF; color: #4F46E5; font-weight: 600; }
  .scenario-btn:hover { border-color: #4F46E5; }
  .run-btn { width: 100%; margin-top: 24px; padding: 12px; background: #4F46E5; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .run-btn:hover { background: #4338CA; }
  .run-btn:disabled { background: #a5b4fc; cursor: not-allowed; }
  .log { margin-top: 20px; background: #1a1a1a; color: #4ade80; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 13px; min-height: 80px; max-height: 200px; overflow-y: auto; display: none; }
  .status { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; color: #666; display: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4F46E5; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }
  .info { font-size: 12px; color: #888; margin-top: 6px; }
</style>
</head>
<body>
<div class="card">
  <h1>🤖 Odoo Demo Agent</h1>
  <p class="sub">Tự động nhập data demo vào Odoo bằng Gemini AI</p>

  <label>URL Odoo</label>
  <input type="url" id="url" placeholder="https://demo.bizapps.vn" value="https://demo.bizapps.vn">

  <label>Tài khoản</label>
  <input type="text" id="user" placeholder="admin" value="admin">

  <label>Mật khẩu</label>
  <div class="toggle">
    <input type="password" id="password" placeholder="Nhập mật khẩu Odoo">
    <span class="eye" onclick="togglePass('password')">👁</span>
  </div>

  <label>Gemini API Key</label>
  <div class="toggle">
    <input type="password" id="gemini" placeholder="AIza... hoặc AQ.Ab8...">
    <span class="eye" onclick="togglePass('gemini')">👁</span>
  </div>
  <p class="info">Lấy key tại <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a></p>

  <hr class="divider">

  <label>Kịch bản chạy</label>
  <div class="scenarios">
    <div class="scenario-btn active" onclick="selectScenario(this,'full')">🚀 Toàn bộ</div>
    <div class="scenario-btn" onclick="selectScenario(this,'contacts')">👥 Contacts</div>
    <div class="scenario-btn" onclick="selectScenario(this,'products')">📦 Products</div>
    <div class="scenario-btn" onclick="selectScenario(this,'crm')">📊 CRM</div>
    <div class="scenario-btn" onclick="selectScenario(this,'quotations')">📄 Báo giá</div>
    <div class="scenario-btn" onclick="selectScenario(this,'projects')">🏗 Projects</div>
  </div>

  <button class="run-btn" id="runBtn" onclick="runAgent()">▶ Chạy Agent</button>

  <div class="status" id="status">
    <div class="dot"></div>
    <span id="statusText">Đang chạy...</span>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
let selectedScenario = 'full';

function selectScenario(el, scenario) {
  document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedScenario = scenario;
}

function togglePass(id) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}

function log(msg) {
  const el = document.getElementById('log');
  el.style.display = 'block';
  el.innerHTML += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

async function runAgent() {
  const url = document.getElementById('url').value.trim();
  const user = document.getElementById('user').value.trim();
  const password = document.getElementById('password').value.trim();
  const gemini = document.getElementById('gemini').value.trim();

  if (!url || !password || !gemini) {
    alert('Vui lòng nhập đầy đủ URL, mật khẩu và Gemini API key');
    return;
  }

  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Đang chạy...';
  document.getElementById('status').style.display = 'flex';
  document.getElementById('log').innerHTML = '';

  log(`[${new Date().toLocaleTimeString()}] Bắt đầu agent...`);
  log(`URL: ${url}`);
  log(`Kịch bản: ${selectedScenario}`);
  log('─'.repeat(40));

  try {
    // Gọi local Python agent qua http server
    const resp = await fetch('http://localhost:7788/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, user, password, gemini_key: gemini, scenario: selectedScenario })
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const text = decoder.decode(value);
      text.split('\n').filter(l => l.trim()).forEach(l => log(l));
    }

    log('─'.repeat(40));
    log(`✅ Hoàn tất!`);
    document.getElementById('statusText').textContent = 'Hoàn tất!';

  } catch (e) {
    log(`❌ Lỗi: ${e.message}`);
    log('Đảm bảo server đang chạy: python server.py');
    document.getElementById('statusText').textContent = 'Lỗi kết nối';
  }

  btn.disabled = false;
  btn.textContent = '▶ Chạy Agent';
}
</script>
</body>
</html>
